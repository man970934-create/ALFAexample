server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /mockServiceWorker.js {
        add_header Cache-Control "no-store";
    }
    # A missing backend must not silently return the SPA document as API data.
    # Replace this location with proxy_pass for a same-origin production API.
    location /api/ {
        default_type application/json;
        return 503 '{"error":{"code":"API_NOT_CONFIGURED","message":"API не настроен"}}';
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
